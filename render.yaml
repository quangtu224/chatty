# Render Blueprint: the only hosted deployment. It deploys main, and only after GitHub
# CI (lint-migrate-build-smoke) passes for that commit. Milestone branches never deploy.
# Secrets are entered once in the Render dashboard (sync: false), never stored here.
services:
  - type: web
    name: chatty
    runtime: docker
    region: frankfurt          # EU, nearest Render region to Supabase eu-west-1
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready   # also checks the database connection
    envVars:
      # APP_ORIGIN is not set: the server uses Render's RENDER_EXTERNAL_URL. Set it only
      # for a custom domain (https://host, no trailing slash).
      # chatty_app via Session pooler with sslmode=verify-full and
      # sslrootcert=/app/certs/supabase-ca.crt (public CA shipped in the image).
      - key: DATABASE_URL
        sync: false
      # One Render proxy in front: per-IP rate limits see the real client.
      - key: TRUST_PROXY
        value: "1"
      # Server-only key from developers.giphy.com; without it only /gif search is off.
      - key: GIPHY_API_KEY
        sync: false
